<title>WSG → webstorage · Transición de cierre</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0a0a0a;
    color: #f4f3f0;
    font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 22px;
  }
  .stagewrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .stage {
    position: relative;
    width: min(360px, 82vw);
    aspect-ratio: 9 / 16;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(227,6,19,.25), 0 20px 60px -30px #000;
    border: 1px solid #1c1c1a;
  }

  /* ---- WSG endframe wordmark ---- */
  .wsg {
    position: absolute; top: 40%; left: 50%;
    transform: translate(-50%,-50%);
    font-weight: 800; font-size: clamp(48px, 15vw, 84px);
    letter-spacing: -.01em;
    color: #ff2b1f;
    text-shadow: 0 0 6px #ff5a4f, 0 0 26px rgba(227,6,19,.9), 0 0 60px rgba(227,6,19,.55);
    will-change: opacity, transform, filter;
  }

  /* ---- neon thread at the foot ---- */
  .neon { position: absolute; inset: 0; pointer-events: none; }
  .neon path { filter: drop-shadow(0 0 4px #ff5a4f) drop-shadow(0 0 12px rgba(227,6,19,.9)); }
  .spark {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 8px #fff, 0 0 18px #ff5a4f, 0 0 30px rgba(227,6,19,.9);
    opacity: 0; will-change: transform, opacity; top: 0; left: 0;
  }

  /* ---- webstorage logo (inverted, white) ---- */
  .logo {
    position: absolute; top: 45%; left: 50%;
    transform: translate(-50%,-50%);
    width: 74%; text-align: left;
    opacity: 0; will-change: opacity;
  }
  .logo .word {
    font-weight: 700; font-size: clamp(30px, 9.5vw, 52px);
    letter-spacing: -.035em; color: #f4f3f0; line-height: .9;
    /* reveal wipe */
    -webkit-mask-image: linear-gradient(90deg,#000 0 0);
    clip-path: inset(0 100% 0 0);
    will-change: clip-path;
  }
  .logo .sub {
    margin-top: 10px; display: flex; align-items: center; gap: 12px;
  }
  .logo .sub span {
    font-weight: 400; font-size: clamp(12px, 3.4vw, 17px);
    letter-spacing: .16em; color: #f4f3f0; white-space: nowrap;
    opacity: 0; will-change: opacity;
  }
  .underline {
    height: 5px; flex: 1; background: #e30613; border-radius: 2px;
    transform-origin: left center; transform: scaleX(0);
    box-shadow: 0 0 0 rgba(227,6,19,0);
    will-change: transform, box-shadow;
  }
  .url {
    position: absolute; bottom: 12%; left: 0; right: 0; text-align: center;
    font-size: clamp(11px, 3vw, 14px); letter-spacing: .22em; color: #8b8a85;
    opacity: 0; will-change: opacity;
  }
  .glint {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 10px #fff, 0 0 22px #ff5a4f;
    opacity: 0; will-change: opacity, transform;
  }

  .controls { display: flex; gap: 10px; align-items: center; }
  button {
    font: inherit; font-size: 13px; letter-spacing: .04em;
    padding: 9px 16px; border-radius: 999px; cursor: pointer;
    background: #1a1a18; color: #f4f3f0; border: 1px solid #2c2b28;
  }
  button:focus-visible { outline: 2px solid #e30613; outline-offset: 2px; }
  .cap { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #6a6965; }
  .beat { font-variant-numeric: tabular-nums; color: #8b8a85; font-size: 12px; min-width: 128px; }
  b.r { color: #ff3b3b; font-weight: 700; }
</style>

<div class="stagewrap">
  <p class="cap">Cierre · 9:16 · <b class="r">WSG</b> → webstorage</p>
  <div class="stage" id="stage">
    <div class="wsg" id="wsg">WSG</div>

    <svg class="neon" id="neonSvg" viewBox="0 0 360 640" preserveAspectRatio="none" aria-hidden="true">
      <path id="neonPath" fill="none" stroke="#ff2b26" stroke-width="3" stroke-linecap="round"
        d="M -10 585 L 120 585 C 150 585 150 548 170 560 C 185 569 188 588 215 588 L 370 588" />
    </svg>
    <div class="spark" id="spark"></div>

    <div class="logo" id="logo">
      <div class="word" id="word">webstorage</div>
      <div class="sub">
        <span id="sub">store&amp;ship</span>
        <div class="underline" id="underline"></div>
      </div>
      <div class="glint" id="glint"></div>
    </div>

    <div class="url" id="url">webstorage.cl</div>
  </div>
  <div class="controls">
    <button id="replay">↻ Reproducir</button>
    <span class="beat" id="beatLabel">Beat A · el hilo</span>
  </div>
</div>

<script>
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wsg = document.getElementById('wsg');
  var word = document.getElementById('word');
  var sub = document.getElementById('sub');
  var underline = document.getElementById('underline');
  var logo = document.getElementById('logo');
  var url = document.getElementById('url');
  var neonPath = document.getElementById('neonPath');
  var spark = document.getElementById('spark');
  var glint = document.getElementById('glint');
  var beatLabel = document.getElementById('beatLabel');
  var stage = document.getElementById('stage');

  var pathCurved = "M -10 585 L 120 585 C 150 585 150 548 170 560 C 185 569 188 588 215 588 L 370 588";
  var pathStraight = "M -10 585 L 120 585 C 150 585 150 585 170 585 C 185 585 188 585 215 585 L 370 585";

  function setBeat(t) { beatLabel.textContent = t; }
  var timers = [];
  function after(ms, fn){ timers.push(setTimeout(fn, ms)); }

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    wsg.style.transition = 'none';
    wsg.style.opacity = 1; wsg.style.transform = 'translate(-50%,-50%) scale(1)'; wsg.style.filter = 'none';
    neonPath.setAttribute('d', pathCurved);
    neonPath.style.transition = 'none'; neonPath.style.opacity = 1;
    spark.style.transition = 'none'; spark.style.opacity = 0;
    logo.style.transition = 'none'; logo.style.opacity = 0;
    word.style.transition = 'none'; word.style.clipPath = 'inset(0 100% 0 0)';
    sub.style.transition = 'none'; sub.style.opacity = 0;
    underline.style.transition = 'none'; underline.style.transform = 'scaleX(0)'; underline.style.boxShadow = '0 0 0 rgba(227,6,19,0)';
    url.style.transition = 'none'; url.style.opacity = 0;
    glint.style.transition = 'none'; glint.style.opacity = 0;
    // force reflow
    void stage.offsetWidth;
  }

  function play() {
    reset();
    if (reduce) {
      // static end-state
      wsg.style.opacity = 0; neonPath.setAttribute('d', pathStraight);
      logo.style.opacity = 1; word.style.clipPath = 'inset(0 0 0 0)';
      sub.style.opacity = 1; underline.style.transform = 'scaleX(1)'; url.style.opacity = 1;
      setBeat('estado final');
      return;
    }

    // BEAT A — thread orders (0–0.5s): spark travels, loop straightens
    setBeat('Beat A · el hilo se ordena');
    spark.style.transition = 'opacity .15s ease';
    spark.style.opacity = 1;
    // animate spark along a rough path with WAAPI
    if (spark.animate) {
      spark.animate([
        { transform: 'translate(340px, 585px)' },
        { transform: 'translate(215px, 588px)' },
        { transform: 'translate(170px, 556px)' },
        { transform: 'translate(120px, 585px)' },
        { transform: 'translate(0px, 585px)' }
      ], { duration: 500, easing: 'ease-in-out', fill: 'forwards' });
    }
    after(120, function(){
      neonPath.style.transition = 'd .5s cubic-bezier(.6,0,.2,1)';
      neonPath.setAttribute('d', pathStraight);
    });
    after(500, function(){ spark.style.opacity = 0; });

    // BEAT B — WSG powers down + line rises (0.5–1.0s)
    after(500, function(){
      setBeat('Beat B · WSG se apaga');
      wsg.style.transition = 'opacity .45s ease, transform .5s ease, filter .5s ease';
      wsg.style.opacity = 0;
      wsg.style.transform = 'translate(-50%,-50%) scale(.96)';
      wsg.style.filter = 'blur(6px)';
      // neon line fades as it "becomes" the logo underline
      neonPath.style.transition = 'opacity .4s ease .2s';
      neonPath.style.opacity = 0;
    });

    // BEAT C — webstorage reveals (1.0–1.8s)
    after(1000, function(){
      setBeat('Beat C · webstorage aparece');
      logo.style.transition = 'opacity .3s ease';
      logo.style.opacity = 1;
      word.style.transition = 'clip-path .7s cubic-bezier(.65,0,.2,1)';
      word.style.clipPath = 'inset(0 0 0 0)';
      underline.style.transition = 'transform .7s cubic-bezier(.65,0,.2,1) .1s';
      underline.style.transform = 'scaleX(1)';
    });
    after(1450, function(){
      sub.style.transition = 'opacity .4s ease';
      sub.style.opacity = 1;
    });

    // BEAT D — signature: underline glow pulse + glint + url (1.8–2.3s)
    after(1800, function(){
      setBeat('Beat D · firma');
      underline.style.transition = 'box-shadow .5s ease';
      underline.style.boxShadow = '0 0 14px rgba(227,6,19,.9)';
      glint.style.left = 'calc(100% - 6px)';
      glint.style.top = '58%';
      glint.style.transition = 'opacity .18s ease, transform .5s ease';
      glint.style.opacity = 1;
      glint.style.transform = 'scale(1.6)';
    });
    after(2150, function(){
      underline.style.boxShadow = '0 0 6px rgba(227,6,19,.5)';
      glint.style.opacity = 0;
      url.style.transition = 'opacity .5s ease';
      url.style.opacity = 1;
      setBeat('hold · logo');
    });

    // loop
    after(4200, play);
  }

  document.getElementById('replay').addEventListener('click', play);
  play();
</script>
